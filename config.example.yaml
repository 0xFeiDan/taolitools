# entropy-arb strategy configuration / 策略配置
#
#   cp config.example.yaml config.yaml     then edit / 复制后修改
#
# This file IS the strategy. Credentials never live here — they go in .env
# (see .env.example). Every key is validated: a typo is a startup error, not
# a setting that silently does nothing.
# 本文件就是策略本身。密钥绝不放在这里（见 .env.example）。所有键名都会被校验：
# 拼写错误会直接报错，而不是静默失效。
#
# WHICH MARKETS to trade is NOT in this file — you state it explicitly on
# every start with command-line flags:
#     python3 main.py --symbol SNDK --hedge lighter-rh
# Entropy is always one leg; --hedge picks the other:
#   lighter      Lighter mainnet            (USDC, 0 bps taker)
#   lighter-rh   Lighter Robinhood chain    (USDG, 0 bps taker)
#   tradexyz     Hyperliquid trade.xyz dex  (USDC, ~1 bps taker)
# 交易哪个市场不在本文件中配置——每次启动时用命令行参数显式指定：
#     python3 main.py --symbol SNDK --hedge lighter-rh
# Entropy 永远是其中一条腿；--hedge 选择对冲腿（三选一，见上表）。

# ============================ THE SIGNAL / 信号 ============================
# premium_bps = (Entropy price / hedge price - 1) * 10000
#
# Static only / 仅 Static 模式：
#   SELL entropy + BUY hedge   when executable premium >= midline + upper
#   BUY entropy + SELL hedge   when executable premium <= midline - lower
# Dynamic mode uses entry_z_score / exit_z_score below and ignores upper/lower.
# Dynamic 模式使用下方 entry_z_score / exit_z_score，忽略 upper/lower。
#
# Both hurdles are net of taker fees (the engine adds fees on top), so one
# full round trip nets >= upper + lower bps after fees by construction.
#
# midline_bps is a number YOU derive from recorded data. Run the bot
# (--record-only) to collect logs/minutes.csv, then:  python3 tools/analyze.py
#
# midline_bps 是你根据采集数据设定的值。先运行机器人（--record-only）采集
# logs/minutes.csv，再运行 python3 tools/analyze.py 获取建议值。
# 两个方向的门槛都已扣除手续费（引擎会在此之上另加手续费），因此一次完整往返
# 扣费后净赚 >= upper + lower bps。
thresholds:
  midline_bps: 0.0     # persistent premium center / 溢价长期中枢
  upper_bps: 4.0       # entry above midline: sell entropy / 中枢上方入场带宽
  lower_bps: 4.0       # entry below midline: buy entropy / 中枢下方入场带宽

# V2 features land in phases. Any switch whose engine phase is still pending
# fails closed at startup. The enabled V2 modules below are active.
# V2 功能分阶段接入。尚未接入引擎的开关会在启动时 fail-closed；下方已开启
# 的 V2 模块均已接入运行时。
#
# Dynamic uses the slow rolling median as its trading baseline. The static
# value above is display-only during warm-up; new entries stay paused until
# min_samples is reached. Fast EMA is only a regime signal, never the baseline.
# dynamic 使用慢速滚动中位数作为交易中枢。预热期上方静态值只用于显示，达到
# min_samples 前禁止新增交易。Fast EMA 只用于 regime 检测，不作为交易基准。
midline:
  mode: dynamic                # static | dynamic
  fast_method: ema             # short estimator / 快线
  fast_window_seconds: 300
  slow_method: median          # robust trading baseline / 稳健慢线
  slow_window_seconds: 1800
  min_samples: 300
  volatility_method: std       # std | mad
  volatility_window_seconds: 1800
  volatility_floor_bps: 0.1    # prevents division by zero / 防止零波动除法
  entry_z_score: 2.5           # OPEN/ADD at +entry or -entry / 开仓或加仓
  exit_z_score: 0.5            # EXIT inside return-to-center zone / 回归后退出

# Opt-in V2 regime guard. It will pause new entries, never silently flatten.
# V2 市场状态保护开关：触发时只暂停新增仓位，不会静默强平。
regime:
  enabled: true
  max_fast_slow_difference_bps: 8.0
  max_z_score: 5.0
  max_absolute_spread_bps: 50.0
  break_persist_seconds: 1.0
  recovery_persist_seconds: 30.0

# Millisecond book-age guard; the legacy connection staleness check
# remains under execution.staleness_sec for backward compatibility.
# 毫秒级盘口年龄保护；旧版连接存活检查仍保留在 execution.staleness_sec。
market_data:
  enforce_book_age: true
  max_book_age_ms: 300

# One switch only / 只需一个开关：
# false = one crypto 24/7 statistics pool.
# true = stock-perpetual session-aware statistics; every session can trade
# after its own Dynamic Midline warm-up and normal risk/edge checks.
# false = 虚拟货币共用一个 24/7 统计池。
# true = 股票永续按盘前/正常/盘后/夜盘四个时段隔离统计；各时段完成独立预热并
# 通过正常风控和可执行 edge 后，都可以开仓、加仓和退出。
session:
  enabled: false

# ======================== VENUES / 交易所参数 ==============================
entropy:
  dex: io                    # Entropy's dex name on Hyperliquid / Entropy 的 dex 名
  quote_asset: USDC          # collateral/price denomination / 计价资产
  taker_fee_bps: 0.0         # taker fee / 吃单手续费
  max_position_usd: 1000     # position cap / 持仓上限（美元）
  max_orders_per_min: 120    # order-send budget, sliding 60s / 每分钟下单预算

hedge:
  # lighter-rh normally uses USDG; lighter/tradexyz normally use USDC.
  # The CLI selection supplies that default; only override for a known change.
  # 程序会根据 --hedge 自动选择默认值；只有交易所规则变化时才手动覆盖 quote_asset。
  taker_fee_bps: 0.0         # Lighter venues: 0; tradexyz: ~1.0
  max_position_usd: 1000
  max_orders_per_min: 30     # Lighter's ceiling is ~40/min / Lighter 上限约 40/分钟

# ========================= SIZING / 下单规模 ===============================
sizing:
  take_fraction: 0.5           # fraction of crossable depth to take / 吃掉可套利深度的比例
  max_order_notional_usd: 500  # per-slice cap / 单笔名义上限
  min_order_notional_usd: 10   # skip dust / 低于此名义不下单
  # V2 current-orderbook VWAP sizing. This walks live depth, not candle VWAP.
  # V2 当前盘口 VWAP 自动仓位：逐档模拟实时深度，不是 K 线 VWAP。
  # Disable to retain the legacy take_fraction + max_order_notional path.
  # 关闭后继续使用旧版 take_fraction + max_order_notional 逻辑。
  vwap_enabled: true
  min_order_usd: 1000
  max_order_usd: 50000
  # Minimum deviation from the active directional midline after modeled costs.
  # 扣除建模成本后，相对当前有效中枢的最小方向偏离。
  minimum_net_edge_bps: 6.0
  max_vwap_slippage_bps: 5.0
  max_book_impact_bps: 5.0
  safety_buffer_bps: 2.0
  expected_latency_cost_bps: 0.0  # set from observed P95/P99 / 根据实测延迟填写

# ==================== INVENTORY LADDER / 库存阶梯 ==========================
# Extra bps required once a venue's position passes floor_frac of its cap in
# the adding direction — ramps linearly to scale_bps at 100% of the cap.
# Slows down one-sided accumulation without hard-stopping the strategy.
# 当某交易所持仓超过上限的 floor_frac 后，同方向继续加仓需额外溢价，线性增加到
# 满仓时的 scale_bps。避免单边持仓快速堆满。 scale_bps: 0 disables / 0 为关闭。
inventory:
  scale_bps: 10.0
  floor_frac: 0

# ======================= EXECUTION / 执行参数 ==============================
execution:
  premium_persist_sec: 0     # edge must persist this long before firing / 信号需持续时间
  cooldown_sec: 0.0            # min gap between executions / 两次执行的最小间隔
  settle_timeout_sec: 10.0      # wait for fill confirmation / 等待成交确认
  leg_slippage_bps: 50.0       # taker limit protection per leg / 每腿滑点保护
  hedge_slippage_bps: 20.0     # price protection on delta hedges / 对冲滑点保护
  net_tolerance_base: 0.001    # max tolerated net delta (base units) / 允许的净敞口
  max_consecutive_errors: 3    # halt after N straight failures / 连续失败 N 次后停机
  rate_limit_pause_sec: 10.0   # pause a 429'd venue this long / 被限频后的暂停时长
  staleness_sec: 10.0          # a feed older than this is stale / 行情超时判定
  reconcile_sec: 15.0          # on-chain position sync cadence / 链上持仓核对周期
  venue_probe_sec: 30.0        # probe cadence for a down venue / 故障交易所探测周期
  http_keepalive_sec: 10.0     # keep order-path TLS warm; 0 = off / 订单链路保活
  # V2 one-leg recovery. On timeout, a confirmed OPEN/ADD leg is immediately
  # unwound reduce-only; unresolved/EXIT outcomes are reconciled then hedged.
  # V2 单腿恢复：超时后立即 reduce-only 撤销已确认的 OPEN/ADD 单腿；
  # 未知结果和 EXIT 等待确认后再对账、恢复 Delta Neutral。
  risk_recovery_enabled: true
  hedge_timeout_ms: 250
  max_unhedged_delta_usd: 5000

# V2 unified kill-switch contract. Emergency flatten stays separately gated
# because it sends real reduce-only orders and must never be enabled implicitly.
# V2 统一熔断配置。紧急平仓会发送真实 reduce-only 订单，因此必须单独显式开启。
kill_switch:
  enabled: true
  max_unhedged_duration_ms: 1000
  max_consecutive_partial_fills: 3
  max_reconcile_mismatch_usd: 1000
  max_session_loss_usd: 0       # 0 = disabled / 0 表示不按会话亏损触发
  emergency_flatten_enabled: false
  emergency_flatten_retry_sec: 2
  emergency_flatten_max_attempts: 0  # 0 = retry until flat / 0 = 持续重试直到平仓

# Append-only audit events plus an atomic restart snapshot. These files contain
# trading/accounting data but no credentials.
# 追加式审计事件 + 原子重启快照；包含交易数据，但不包含密钥。
accounting:
  enabled: true
  ledger_jsonl: logs/pair-ledger.jsonl
  state_json: logs/runtime-state.json

# Current rates are fetched from each venue. Positive funding means longs pay.
# Enabled-but-stale data blocks OPEN/ADD rather than silently using zero.
# 当前费率从两边交易所读取；正资金费表示多头支付。启用后数据缺失/过期会禁止开仓。
funding:
  enabled: true
  expected_holding_hours: 1
  refresh_seconds: 60
  max_age_seconds: 180

# Quote assets are normalized to USD with Coinbase Exchange level-1 books.
# A missing source fails closed; a severe depeg pauses OPEN/ADD.
# 使用 Coinbase Exchange 一档盘口将计价资产换算为 USD；数据缺失或严重脱锚会暂停开仓。
stablecoin:
  enabled: true
  source_url: https://api.exchange.coinbase.com
  refresh_seconds: 30
  max_age_seconds: 90
  warning_deviation_bps: 10
  halt_deviation_bps: 30

# ================== DATA RECORDER / 数据采集 ===============================
# Always-on while the bot runs: samples both real order books 1/sec and
# writes one CSV row per minute. This is the input for tools/analyze.py.
# 机器人运行期间自动开启：每秒采样两边真实盘口，每分钟写一行 CSV，
# 供 tools/analyze.py 分析并设定上方 thresholds。
recorder:
  enabled: true
  csv: logs/minutes.csv

# ==================== LOGGING & DASHBOARD / 日志与仪表盘 ====================
# On a terminal the bot shows a live Rich dashboard (books, signal, positions,
# PnL, recent executions); log lines then go to `file` instead of the console.
# Off-terminal runs (nohup/systemd) fall back to plain console logs
# automatically; --no-dashboard forces that.
# 在终端运行时显示实时 Rich 仪表盘（盘口、信号、持仓、盈亏、最近成交），
# 日志写入 `file` 而不再打印到屏幕。非终端环境（nohup/systemd）自动退回
# 纯日志模式；也可用 --no-dashboard 强制关闭。
logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: logs/trades.csv
  dashboard: true
  file: logs/engine.log
